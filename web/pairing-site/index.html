<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIMORDIAL LORD • WhatsApp Pairing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="card">

      <div class="symbol">𖣔 𓁹 𖣔</div>

      <h1>PRIMORDIAL LORD</h1>
      <h2>THE FIRST SOVEREIGN</h2>

      <div class="divider">༒════════════════════༒</div>

      <p class="status">CONNECT YOUR WHATSAPP</p>

      <form id="pairForm">
        <label for="phone">WhatsApp Number</label>

        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="+234 801 234 5678"
          required
        >

        <button type="submit" id="pairButton">
          𖣔 PAIR NOW
        </button>
      </form>

      <div id="result" class="result"></div>

      <div class="divider">༒════════════════════༒</div>

      <p class="quote">
        “The throne does not choose its sovereign.<br>
        It remembers him.”
      </p>

      <p class="footer">
        AURELIAN • THE PRIMORDIAL LORD
      </p>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
